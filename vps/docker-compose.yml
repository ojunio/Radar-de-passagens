# Radar de passagens na VPS, separado do CRM (projeto "radar", pasta /opt/radar).
# Não usa nada do CRM: WAHA próprio, sessão própria, sem acesso às portas 80/443.
#
#   docker compose -p radar -f /opt/radar/app/vps/docker-compose.yml --env-file /opt/radar/.env up -d --build
services:
  waha:
    image: devlikeapro/waha@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      TZ: America/Sao_Paulo
    volumes:
      - waha_sessions:/app/.sessions

  radar:
    build:
      context: ..
      dockerfile: vps/Dockerfile
    restart: unless-stopped
    depends_on:
      - waha
    environment:
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      WAHA_SESSION: default
      WHATSAPP_DESTINO: ${WHATSAPP_DESTINO:?}
      WHATSAPP_INTERNO: ${WHATSAPP_INTERNO:-}
      RELAY_SECRET: ${RELAY_SECRET:?}
      RADAR_DATA_DIR: /data
      TZ: America/Sao_Paulo
    volumes:
      - ..:/app:ro
      - /opt/radar/data:/data
    ports:
      - "127.0.0.1:8787:8787"   # só acessível de dentro da VPS
    networks:
      default: {}
      # Rede do CRM: só para o Caddy do CRM entregar https://radar.moovcrm.tech ao ponto de envio.
      crm:
        aliases: [radar-relay]

networks:
  crm:
    external: true
    name: crm_default

volumes:
  waha_sessions:
