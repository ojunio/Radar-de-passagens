name: Radar de passagens SP-Lisboa

# Agendamento desligado em 19/11/2026: a partir dos servidores do GitHub o Google não devolve
# preços. O radar agora roda na VPS (pasta vps/). Este workflow fica só para teste manual.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "normal, teste-aviso (só você) ou teste-bianca"
        default: "normal"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          WHATSAPP_DESTINO: ${{ secrets.WHATSAPP_DESTINO }}
          WHATSAPP_INTERNO: ${{ secrets.WHATSAPP_INTERNO }}
        run: |
          if [ "${{ github.event.inputs.modo }}" = "teste-aviso" ]; then
            python radar.py --teste-aviso
          elif [ "${{ github.event.inputs.modo }}" = "teste-bianca" ]; then
            python radar.py --teste-aviso --para-bianca
          else
            python radar.py
          fi

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "varredura $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
